<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/app/stilesPage/stilesRegistro.css">
    <title>Formulario de registro</title>
</head>
<body>
    <div class="contenedorGeneral">
        <div class="logoRegistro">
        <img src="/img/logo.png" class="logoR">
        </div>
        <form class="formularioR">
            <div class="inputs1Registro">
                <p>Nombre</p>
                <p>Apellido</p>
            </div>
            <div class="inputs2Registro">
                <input type="text" name="nombre" placeholder="Nombre" id="nombreR" required>
                <input type="text" name="apellido" placeholder="Apellido" id="apellidoR" required>
            </div>
            <div class="inputs3Registro">
                <p>Cedula</p>
                <input type="text" name="cedula" placeholder="Cedula" id="nombreR" required>
                <p>Fecha de nacimiento</p>
                <input type="date" name="fecha" placeholder="Fecha" id="fechaNacimientoR" required>
                <p>Email</p>
                <input type="email" name="nombre" placeholder="Em@il" id="emailR" required>
                <p>Contraseña</p>
                <input type="password" name="apellido" placeholder="Contraseña" id="contraseñaR" required>
            </div>
            <div class="inputRegistro" id="inputRegistro">
                <input type="submit" name="botonRegistro" value="Registrarse" class="inputRegistrarse">
            </div>
            <div class="tyc">
                <input type="checkbox" class="input1tyc" id="valuetyc" required>
                <a href="">Acepto terminos y condiciones</a>
                <input type="checkbox" class="input2tyc" id="envioCredenciales">
                <p>Enviar credenciales via email</p>
            </div>
                <div class="botonR">
                <button class="botonRegresar"><a href="">Regresar</a></button>
                </div>
            </form>
            </div>
 
        

    </div>
</body>
</html>
